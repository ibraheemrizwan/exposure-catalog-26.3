import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

group = "io.github.mortuusars.${mod_id}"
version = mod_version
base.archivesName = "${mod_id}-fabric-${minecraft_version}"

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven {
        url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/'
        content { includeGroup 'fuzs.forgeconfigapiport' }
    }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven { url = 'https://maven.blamejared.com/' }
    ivy {
        name = 'ExposureReleases'
        url = 'https://github.com/ibraheemrizwan/exposure-26.3/releases/download'
        patternLayout { artifact 'v[revision]/[artifact]-[revision].[ext]' }
        metadataSources { artifact() }
        content { includeModule 'io.github.mortuusars.exposure', 'exposure-fabric-26.3' }
    }
}

sourceSets {
    main {
        java.setSrcDirs(['common/src/main/java', 'fabric/src/main/java'])
        resources.setSrcDirs(['common/src/main/resources', 'fabric/src/main/resources'])
    }
    test {
        java.setSrcDirs(['common/src/test/java'])
        resources.setSrcDirs(['common/src/test/resources'])
    }
}

loom {
    accessWidenerPath = file("common/src/main/resources/${mod_id}.accesswidener")
    runs {
        client { client(); runDir('run/client') }
        server { server(); runDir('run/server'); programArg('nogui') }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forge_config_api_port_version}"
    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Override with -PexposureJar=/path/to/exposure.jar when building against a local checkout.
    if (providers.gradleProperty('exposureJar').isPresent()) {
        implementation files(providers.gradleProperty('exposureJar').get())
    } else {
        implementation "io.github.mortuusars.exposure:exposure-fabric-26.3:${exposure_version}"
    }
    implementation('maven.modrinth:fabric-permissions-api:b1EqjxFs') { transitive = false }
    include('maven.modrinth:fabric-permissions-api:b1EqjxFs') { transitive = false }
    compileOnly 'net.luckperms:api:5.4'

}

java { toolchain.languageVersion = JavaLanguageVersion.of(25) }
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}
tasks.withType(Test).configureEach { useJUnitPlatform() }

def metadata = [mod_id: mod_id, mod_version: mod_version, mod_name: mod_name,
    mod_description: mod_description, mod_authors: 'mortuusars', mod_license: 'MIT',
    mod_page: "https://github.com/ibraheemrizwan/${repository_name}",
    mod_github: "https://github.com/ibraheemrizwan/${repository_name}",
    required_exposure_version_range_fabric: '>=1.9.19+26.3.port.4']

processResources {
    inputs.properties(metadata)
    filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) { expand(metadata) }
    exclude 'architectury.common.json'
    doLast {
        def descriptor = new File(destinationDir, 'fabric.mod.json')
        def json = new JsonSlurper().parse(descriptor)
        json.depends.remove('fabric')
        json.depends.minecraft = '26.3'
        json.depends.fabricloader = ">=${loader_version}"
        json.depends.java = '>=25'
        json.depends['fabric-api'] = ">=${fabric_api_version}"
        if (mod_id != 'exposure_catalog') json.depends.forgeconfigapiport = ">=${forge_config_api_port_version}"
        json.accessWidener = "${mod_id}.accesswidener"
        json.contact.issues = "https://github.com/ibraheemrizwan/${repository_name}/issues"
        descriptor.text = JsonOutput.prettyPrint(JsonOutput.toJson(json)) + '\n'
    }
}

jar {
    from('LICENSE.md') { rename { "LICENSE_${mod_id}" } }
    from('NOTICE.md')
}
